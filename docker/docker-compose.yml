services:
  mongodb:
    image: mongo:8.3.11-noble
    
    container_name: mongodb
    
    ports:
      - "27017:27017" #27017 is the default, the left side is the actual value, right side is the value I want
    
    volumes:
      - ./mongodb:/data/db

    restart: unless-stopped

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

  pgvector:
    image: pgvector/pgvector:0.8.7-pg18-trixie

    container_name: pgvector

    ports:
      - "5432:5432"

    volumes:
      - pgvector_data:/var/lib/postgresql

    restart: unless-stopped

    environment:
      - POSTGRES_PASSWORD= ${POSTGRES_PASSWORD}

networks:
  backend:

volumes:
  pgvector_data:
